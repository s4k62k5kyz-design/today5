name: Verify fridge UI in Chrome

on:
  push:
    branches: ["main"]
    paths:
      - "fridge/**"
      - ".github/workflows/fridge-browser-check.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Pages publish
        run: sleep 40
      - name: Verify mobile fridge UI
        shell: bash
        run: |
          google-chrome --headless=new --no-sandbox --disable-gpu --use-fake-ui-for-media-stream --use-fake-device-for-media-stream --remote-debugging-address=127.0.0.1 --remote-debugging-port=9222 about:blank >/tmp/chrome.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:9222/json/version >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:9222/json/version >/dev/null || { cat /tmp/chrome.log; exit 1; }
          cat > /tmp/check.mjs <<'NODE'
          const targetUrl = 'https://s4k62k5kyz-design.github.io/today5/fridge/';
          const created = await fetch('http://127.0.0.1:9222/json/new?' + encodeURIComponent(targetUrl), {method:'PUT'});
          if (!created.ok) throw new Error('Could not create Chrome tab: ' + created.status);
          const info = await created.json();
          const ws = new WebSocket(info.webSocketDebuggerUrl);
          await new Promise((resolve,reject)=>{ws.onopen=resolve;ws.onerror=reject});
          let id=0; const pending=new Map();
          ws.onmessage=(e)=>{const m=JSON.parse(e.data);if(m.id&&pending.has(m.id)){pending.get(m.id)(m);pending.delete(m.id)}};
          function cmd(method,params={}){return new Promise(res=>{const n=++id;pending.set(n,res);ws.send(JSON.stringify({id:n,method,params}))})}
          await cmd('Page.enable');
          await cmd('Emulation.setDeviceMetricsOverride',{width:390,height:844,deviceScaleFactor:3,mobile:true});
          await new Promise(r=>setTimeout(r,3500));
          let r=await cmd('Runtime.evaluate',{expression:`
            (() => {
              const login=document.getElementById('login');
              if(login) login.classList.remove('show');
              const add=document.getElementById('add');
              if(!add) return {ok:false,reason:'add button missing',title:document.title,url:location.href};
              add.click();
              const expiry=document.querySelector('.expiry-field');
              const quantity=document.getElementById('quantity')?.closest('.field');
              const er=expiry?.getBoundingClientRect();
              const qr=quantity?.getBoundingClientRect();
              const overlaps=!!(er&&qr&&!(er.right<=qr.left||qr.right<=er.left||er.bottom<=qr.top||qr.bottom<=er.top));
              return {
                ok:true,
                storage:[...document.querySelectorAll('#storage option')].map(x=>x.textContent),
                tabs:[...document.querySelectorAll('#tabs .tab[data-s]')].map(x=>x.dataset.s),
                hasAddCategory:!!document.getElementById('addCategory'),
                hasHistoryPick:!!document.getElementById('historyPick'),
                hasManageCategories:!!document.getElementById('manageCategories'),
                hasManageFoods:!!document.getElementById('manageFoods'),
                hasStatusCards:document.querySelectorAll('#statusCards .statCard').length===3,
                addButtonText:document.getElementById('saveBtn')?.textContent||'',
                hasRemainingToggle:!!document.getElementById('trackRemaining'),
                remainingOptions:[...document.querySelectorAll('#remainingLevel option')].map(x=>x.textContent),
                hasBarcodeInput:!!document.getElementById('barcode'),
                hasScanButton:!!document.getElementById('scanBarcode'),
                scannerLibraryLoaded:typeof Html5Qrcode==='function',
                hasHelpTab:!!document.getElementById('helpTab'),
                helpSections:document.querySelectorAll('#helpOverlay .helpsec').length,
                helpPosition:(() => {
                  const h=document.getElementById('helpTab');
                  if(!h) return null;
                  const r=h.getBoundingClientRect(),s=getComputedStyle(h);
                  return {position:s.position,x:r.x,y:r.y,w:r.width,h:r.height};
                })(),
                expiryRect:er?{x:er.x,y:er.y,w:er.width,h:er.height}:null,
                quantityRect:qr?{x:qr.x,y:qr.y,w:qr.width,h:qr.height}:null,
                overlaps
              };
            })()
          `,returnByValue:true});
          const state=r.result.result.value;
          console.log(JSON.stringify(state));
          if(!state?.ok) throw new Error(JSON.stringify(state));
          if(JSON.stringify(state.storage)!==JSON.stringify(['冷蔵庫上','野菜室','冷凍庫小','冷凍庫大'])) throw new Error('Storage options wrong: '+JSON.stringify(state.storage));
          if(JSON.stringify(state.tabs)!==JSON.stringify(['すべて','冷蔵庫上','野菜室','冷凍庫小','冷凍庫大'])) throw new Error('Tabs wrong: '+JSON.stringify(state.tabs));
          if(!state.hasAddCategory||!state.hasHistoryPick||!state.hasManageCategories||!state.hasManageFoods) throw new Error('Category/history management controls missing');
          if(!state.hasStatusCards) throw new Error('Summary status cards missing');
          if(state.addButtonText!=='追加する') throw new Error('Add action text wrong: '+state.addButtonText);
          if(!state.hasRemainingToggle) throw new Error('Remaining meter toggle missing');
          if(JSON.stringify(state.remainingOptions)!==JSON.stringify(['満タン','75%','半分','25%','ほぼ空'])) throw new Error('Remaining meter options wrong: '+JSON.stringify(state.remainingOptions));
          r=await cmd('Runtime.evaluate',{expression:`
            (() => {
              const t=document.getElementById('trackRemaining');
              const box=document.getElementById('remainingControls');
              const before=getComputedStyle(box).display;
              t.click();
              const after=getComputedStyle(box).display;
              return {before,after,checked:t.checked};
            })()
          `,returnByValue:true});
          const remainingState=r.result.result.value;
          console.log(JSON.stringify({remainingState}));
          if(remainingState.before!=='none'||remainingState.after==='none'||!remainingState.checked) throw new Error('Remaining meter toggle did not work: '+JSON.stringify(remainingState));
          if(!state.hasBarcodeInput||!state.hasScanButton) throw new Error('Barcode controls missing');
          if(!state.scannerLibraryLoaded) throw new Error('Barcode scanner library failed to load');
          if(!state.hasHelpTab||state.helpSections<8) throw new Error('Help manual missing');
          if(!state.helpPosition||state.helpPosition.position!=='fixed'||state.helpPosition.x>30||state.helpPosition.y>45) throw new Error('Help is not fixed at top-left: '+JSON.stringify(state.helpPosition));
          if(state.overlaps) throw new Error('Expiry and quantity overlap on mobile: '+JSON.stringify(state));
          r=await cmd('Runtime.evaluate',{expression:`
            (() => {
              const soon=document.querySelector('#statusCards [data-status="soon"]');
              const expired=document.querySelector('#statusCards [data-status="expired"]');
              const all=document.querySelector('#statusCards [data-status="all"]');
              soon.click();
              const s1=soon.classList.contains('on')&&!expired.classList.contains('on')&&!all.classList.contains('on');
              expired.click();
              const s2=expired.classList.contains('on')&&!soon.classList.contains('on')&&!all.classList.contains('on');
              all.click();
              const s3=all.classList.contains('on')&&!soon.classList.contains('on')&&!expired.classList.contains('on');
              return {soon:s1,expired:s2,all:s3};
            })()
          `,returnByValue:true});
          const statusState=r.result.result.value;
          console.log(JSON.stringify({statusState}));
          if(!statusState.soon||!statusState.expired||!statusState.all) throw new Error('Summary filters did not toggle correctly: '+JSON.stringify(statusState));
          r=await cmd('Runtime.evaluate',{expression:`
            (() => {
              document.getElementById('manageCategories').click();
              const a={open:document.getElementById('manageOverlay')?.classList.contains('show')||false,title:document.getElementById('manageTitle')?.textContent||''};
              document.getElementById('closeManage').click();
              document.getElementById('manageFoods').click();
              const b={open:document.getElementById('manageOverlay')?.classList.contains('show')||false,title:document.getElementById('manageTitle')?.textContent||''};
              document.getElementById('closeManage').click();
              return {categories:a,foods:b,deleteButton:!!document.getElementById('masterDelete')};
            })()
          `,returnByValue:true});
          const manageState=r.result.result.value;
          console.log(JSON.stringify({manageState}));
          if(!manageState.categories.open||manageState.categories.title!=='カテゴリー管理') throw new Error('Category manager did not open: '+JSON.stringify(manageState));
          if(!manageState.foods.open||manageState.foods.title!=='食材名管理') throw new Error('Food manager did not open: '+JSON.stringify(manageState));
          if(!manageState.deleteButton) throw new Error('Master delete button missing');
          r=await cmd('Runtime.evaluate',{expression:`
            (() => {
              document.getElementById('helpTab').click();
              const h=document.getElementById('helpOverlay');
              return {open:h?.classList.contains('show')||false,title:h?.querySelector('h2')?.textContent||''};
            })()
          `,returnByValue:true});
          const helpState=r.result.result.value;
          console.log(JSON.stringify({helpState}));
          if(!helpState.open||helpState.title!=='冷蔵庫ノートの使い方') throw new Error('Help tab did not open: '+JSON.stringify(helpState));
          r=await cmd('Runtime.evaluate',{expression:`
            (() => {
              document.getElementById('closeHelp').click();
              document.getElementById('scanBarcode').click();
              return true;
            })()
          `,returnByValue:true});
          await new Promise(r=>setTimeout(r,3500));
          r=await cmd('Runtime.evaluate',{expression:`
            (() => {
              const ov=document.getElementById('scannerOverlay');
              const video=document.querySelector('#barcodeReader video');
              const status=document.getElementById('scanStatus')?.textContent||'';
              const sel=document.getElementById('cameraSelect');
              return {
                overlayOpen:ov?.classList.contains('show')||false,
                status,
                videoPresent:!!video,
                videoReady:!!(video&&video.srcObject),
                cameraOptions:sel?[...sel.options].length:0
              };
            })()
          `,returnByValue:true});
          const cameraState=r.result.result.value;
          console.log(JSON.stringify({cameraState}));
          if(!cameraState.overlayOpen) throw new Error('Scanner overlay did not open');
          if(/開始できません|対応していません/.test(cameraState.status)) throw new Error('Desktop/Android-style camera path failed: '+JSON.stringify(cameraState));
          if(!cameraState.videoPresent) throw new Error('Camera video element missing: '+JSON.stringify(cameraState));
          ws.close();
          NODE
          node /tmp/check.mjs
