name: Verify fridge UI in Chrome

on:
  push:
    branches: ["main"]
    paths:
      - "fridge/**"
      - ".github/workflows/fridge-browser-check.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Pages publish
        run: sleep 40
      - name: Verify mobile fridge UI
        shell: bash
        run: |
          google-chrome --headless=new --no-sandbox --disable-gpu --remote-debugging-address=127.0.0.1 --remote-debugging-port=9222 about:blank >/tmp/chrome.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:9222/json/version >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:9222/json/version >/dev/null || { cat /tmp/chrome.log; exit 1; }
          cat > /tmp/check.mjs <<'NODE'
          const targetUrl = 'https://s4k62k5kyz-design.github.io/today5/fridge/';
          const created = await fetch('http://127.0.0.1:9222/json/new?' + encodeURIComponent(targetUrl), {method:'PUT'});
          if (!created.ok) throw new Error('Could not create Chrome tab: ' + created.status);
          const info = await created.json();
          const ws = new WebSocket(info.webSocketDebuggerUrl);
          await new Promise((resolve,reject)=>{ws.onopen=resolve;ws.onerror=reject});
          let id=0; const pending=new Map();
          ws.onmessage=(e)=>{const m=JSON.parse(e.data);if(m.id&&pending.has(m.id)){pending.get(m.id)(m);pending.delete(m.id)}};
          function cmd(method,params={}){return new Promise(res=>{const n=++id;pending.set(n,res);ws.send(JSON.stringify({id:n,method,params}))})}
          await cmd('Page.enable');
          await cmd('Emulation.setDeviceMetricsOverride',{width:390,height:844,deviceScaleFactor:3,mobile:true});
          await new Promise(r=>setTimeout(r,3500));
          let r=await cmd('Runtime.evaluate',{expression:`
            (() => {
              const login=document.getElementById('login');
              if(login) login.classList.remove('show');
              const add=document.getElementById('add');
              if(!add) return {ok:false,reason:'add button missing',title:document.title,url:location.href};
              add.click();
              const expiry=document.querySelector('.expiry-field');
              const quantity=document.getElementById('quantity')?.closest('.field');
              const er=expiry?.getBoundingClientRect();
              const qr=quantity?.getBoundingClientRect();
              const overlaps=!!(er&&qr&&!(er.right<=qr.left||qr.right<=er.left||er.bottom<=qr.top||qr.bottom<=er.top));
              return {
                ok:true,
                storage:[...document.querySelectorAll('#storage option')].map(x=>x.textContent),
                tabs:[...document.querySelectorAll('#tabs .tab')].map(x=>x.dataset.s),
                hasAddCategory:!!document.getElementById('addCategory'),
                hasHistoryPick:!!document.getElementById('historyPick'),
                hasBarcodeInput:!!document.getElementById('barcode'),
                hasScanButton:!!document.getElementById('scanBarcode'),
                scannerLibraryLoaded:typeof Html5Qrcode==='function',
                expiryRect:er?{x:er.x,y:er.y,w:er.width,h:er.height}:null,
                quantityRect:qr?{x:qr.x,y:qr.y,w:qr.width,h:qr.height}:null,
                overlaps
              };
            })()
          `,returnByValue:true});
          const state=r.result.result.value;
          console.log(JSON.stringify(state));
          if(!state?.ok) throw new Error(JSON.stringify(state));
          if(JSON.stringify(state.storage)!==JSON.stringify(['冷蔵庫上','野菜室'])) throw new Error('Storage options wrong: '+JSON.stringify(state.storage));
          if(JSON.stringify(state.tabs)!==JSON.stringify(['すべて','冷蔵庫上','野菜室'])) throw new Error('Tabs wrong: '+JSON.stringify(state.tabs));
          if(!state.hasAddCategory||!state.hasHistoryPick) throw new Error('Category/history controls missing');
          if(!state.hasBarcodeInput||!state.hasScanButton) throw new Error('Barcode controls missing');
          if(!state.scannerLibraryLoaded) throw new Error('Barcode scanner library failed to load');
          if(state.overlaps) throw new Error('Expiry and quantity overlap on mobile: '+JSON.stringify(state));
          ws.close();
          NODE
          node /tmp/check.mjs
