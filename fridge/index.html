<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f3f7f4"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="冷蔵庫ノート"><meta name="robots" content="noindex,nofollow"><title>冷蔵庫ノート</title>
<style>
:root{--g:#237a4b;--bg:#f3f7f4;--line:#dce7df;--text:#17211b;--sub:#6b766e;--red:#c63c3c;--amber:#a66b00}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:760px;margin:auto;padding:calc(16px + env(safe-area-inset-top)) 14px calc(105px + env(safe-area-inset-bottom))}.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.brand{display:flex;gap:10px;align-items:center}.logo{width:44px;height:44px;border-radius:14px;background:#e7f5ec;display:grid;place-items:center;font-size:24px}.brand h1{font-size:22px;margin:0}.brand p{font-size:11px;color:var(--sub);margin:2px 0 0}.icon{height:42px;min-width:42px;border:1px solid var(--line);border-radius:12px;background:white}.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.box{background:white;border:1px solid var(--line);border-radius:16px;padding:12px}.n{font-size:24px;font-weight:800}.l{font-size:11px;color:var(--sub);margin-top:4px}.warn .n{color:var(--amber)}.danger .n{color:var(--red)}.tabs{display:flex;gap:7px;overflow:auto;margin:13px 0 6px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{white-space:nowrap;border:1px solid var(--line);background:white;color:var(--sub);border-radius:999px;padding:9px 13px;font-weight:700;font-size:13px}.tab.on{background:var(--g);color:white;border-color:var(--g)}.tools{display:grid;grid-template-columns:1fr 48px;gap:8px;margin:10px 0}.search{height:46px;border:1px solid var(--line);border-radius:14px;background:white;padding:0 14px;outline:none}.meta{display:flex;justify-content:space-between;align-items:center;color:var(--sub);font-size:12px;margin:9px 2px}.meta select{border:0;background:transparent;color:var(--sub)}.list{display:grid;gap:10px}.item{background:white;border:1px solid var(--line);border-radius:18px;padding:14px}.top{display:flex;gap:11px}.emo{width:44px;height:44px;border-radius:14px;background:#f2f6f3;display:grid;place-items:center;font-size:23px;flex:none}.main{flex:1;min-width:0}.row{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.name{font-size:17px;font-weight:800}.tag{font-size:10px;background:#eef4f0;border-radius:999px;padding:3px 7px;color:#526257}.memo{color:var(--sub);font-size:12px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.expiry{display:inline-block;margin-top:7px;padding:5px 8px;border-radius:9px;background:#f0f4f1;color:#59655d;font-size:11px;font-weight:700}.soon{background:#fff2d9;color:var(--amber)}.expired{background:#fdeaea;color:var(--red)}.today{background:#fff0e5;color:#b24d00}.actions{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:12px}.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden}.qty button{width:38px;height:36px;border:0;background:#fafcfb;color:var(--g);font-size:19px}.qtxt{min-width:72px;text-align:center;font-size:13px;font-weight:800}.ab{display:flex;gap:6px}.small{height:36px;border:1px solid var(--line);border-radius:11px;background:white;padding:0 10px;font-size:12px;color:var(--sub);font-weight:700}.done{color:var(--g);background:#f3fbf6;border-color:#b7d8c3}.empty{text-align:center;background:white;border:1px dashed #cbd8cf;border-radius:18px;padding:48px 20px;color:var(--sub)}.empty b{display:block;color:var(--text);margin:6px}.fab{position:fixed;right:max(18px,calc((100vw - 760px)/2 + 18px));bottom:calc(20px + env(safe-area-inset-bottom));height:56px;border:0;border-radius:18px;background:var(--g);color:white;padding:0 20px;font-weight:800;box-shadow:0 12px 28px #237a4b44;z-index:20}.overlay{position:fixed;inset:0;background:#121c166f;display:none;align-items:flex-end;justify-content:center;z-index:100}.overlay.show{display:flex}.sheet{width:min(760px,100%);max-height:92vh;overflow:auto;background:white;border-radius:24px 24px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom))}.sh{display:flex;justify-content:space-between;align-items:center}.sh h2{font-size:19px;margin:0 0 14px}.close{width:36px;height:36px;border:0;border-radius:50%;background:#f1f5f2}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:grid;gap:5px}.full{grid-column:1/-1}.field label{font-size:12px;color:var(--sub);font-weight:700}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:white;outline:none}.field textarea{min-height:76px}.save{width:100%;height:50px;border:0;border-radius:14px;background:var(--g);color:white;font-weight:800;margin-top:14px}.del{width:100%;height:44px;border:0;background:white;color:var(--red);font-weight:700}.login{position:fixed;inset:0;background:linear-gradient(#edf6f0,#f7faf8);z-index:300;display:none;align-items:center;justify-content:center;padding:22px}.login.show{display:flex}.card{width:min(420px,100%);background:white;border:1px solid var(--line);border-radius:24px;padding:24px;text-align:center;box-shadow:0 16px 44px #17372218}.card .big{font-size:52px}.card h2{margin:5px}.card p{color:var(--sub);font-size:13px;line-height:1.6}.pass{width:100%;height:52px;border:1px solid var(--line);border-radius:14px;text-align:center;font-size:22px;font-weight:800;letter-spacing:8px}.loginbtn{width:100%;height:50px;margin-top:10px;border:0;border-radius:14px;background:var(--g);color:white;font-weight:800}.err{min-height:18px;color:var(--red);font-size:12px;margin-top:7px}.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translate(-50%,15px);background:#17211b;color:white;padding:10px 14px;border-radius:12px;font-size:12px;opacity:0;transition:.2s;z-index:400}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:640px){.overlay{align-items:center}.sheet{border-radius:24px}.grid{grid-template-columns:1.4fr 1fr 1fr}}
</style></head><body>
<div class="login show" id="login"><div class="card"><div class="big">🧊</div><h2>冷蔵庫ノート</h2><p>家族共通の在庫管理です。<br>最初だけ6桁の暗証番号を入力してください。</p><form id="loginForm" style="margin:0"><input id="pass" class="pass" inputmode="numeric" maxlength="6" placeholder="••••••"><button id="loginbtn" class="loginbtn" type="submit">開く</button><div id="err" class="err"></div></form></div></div>
<main class="app"><div class="head"><div class="brand"><div class="logo">🧊</div><div><h1>冷蔵庫ノート</h1><p id="sync">同期しています…</p></div></div><button class="icon" id="logout">⋯</button></div>
<div class="sum"><div class="box"><div class="n" id="all">0</div><div class="l">登録中</div></div><div class="box warn"><div class="n" id="soon">0</div><div class="l">3日以内</div></div><div class="box danger"><div class="n" id="expired">0</div><div class="l">期限切れ</div></div></div>
<div class="tabs" id="tabs"><button class="tab on" data-s="すべて">すべて</button><button class="tab" data-s="冷蔵">🧊 冷蔵</button><button class="tab" data-s="冷凍">❄️ 冷凍</button><button class="tab" data-s="常温">🏠 常温</button></div>
<div class="tools"><input class="search" id="search" placeholder="食材名・メモを検索"><button class="icon" id="refresh">↻</button></div><div class="meta"><span id="count">0件</span><select id="sort"><option value="expiry">期限が近い順</option><option value="updated">更新が新しい順</option><option value="name">名前順</option></select></div><div class="list" id="list"></div></main>
<button class="fab" id="add">＋ 食材を追加</button>
<div class="overlay" id="overlay"><div class="sheet"><div class="sh"><h2 id="title">食材を追加</h2><button class="close" id="close">×</button></div><form id="form"><input type="hidden" id="id"><div class="grid">
<div class="field full"><label>食材名 *</label><input id="name" maxlength="100" required placeholder="例：牛乳、卵、キャベツ"></div>
<div class="field"><label>保存場所</label><select id="storage"><option>冷蔵</option><option>冷凍</option><option>常温</option></select></div>
<div class="field"><label>カテゴリー</label><select id="category"><option>野菜・果物</option><option>肉・魚</option><option>乳製品・卵</option><option>飲み物</option><option>調味料</option><option>作り置き</option><option>冷凍食品</option><option selected>その他</option></select></div>
<div class="field"><label>賞味・消費期限</label><input id="expiry" type="date"></div><div class="field"><label>数量</label><input id="quantity" type="number" min="0" step="0.1" value="1"></div>
<div class="field"><label>単位</label><select id="unit"><option>個</option><option>本</option><option>袋</option><option>パック</option><option>枚</option><option>g</option><option>kg</option><option>ml</option><option>L</option><option>食</option><option>箱</option></select></div>
<div class="field full"><label>メモ</label><textarea id="memo" maxlength="500" placeholder="例：開封済み、夕食用"></textarea></div></div><button class="save">保存する</button><button type="button" class="del" id="del" style="display:none">この食材を削除</button></form></div></div><div class="toast" id="toast"></div>
<script>
(function(){var BASE="https://rngmvobnxliegijzzdbg.supabase.co/functions/v1/fridge-manager",st={items:[],s:"すべて",q:"",sort:"expiry"},memToken="";function safeGet(){try{return localStorage.getItem("fridge_token")||""}catch(e){return""}}function safeSet(v){memToken=v;try{localStorage.setItem("fridge_token",v)}catch(e){}}function safeDel(){memToken="";try{localStorage.removeItem("fridge_token")}catch(e){}}memToken=safeGet();var $=function(x){return document.getElementById(x)},em={"野菜・果物":"🥬","肉・魚":"🥩","乳製品・卵":"🥛","飲み物":"🥤","調味料":"🧂","作り置き":"🍱","冷凍食品":"❄️","その他":"📦"};
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]})}
async function api(path,opt){opt=opt||{};var tok=memToken||safeGet(),method=String(opt.method||"GET").toUpperCase(),sendMethod=method,url=BASE+path;if(tok&&path!=="/api/login")url+=(url.indexOf("?")>=0?"&":"?")+"token="+encodeURIComponent(tok);if(method==="PATCH"||method==="DELETE"){url+=(url.indexOf("?")>=0?"&":"?")+"_method="+method;sendMethod="POST"}var hs={},body=opt.body;if(body!=null)hs["Content-Type"]="text/plain;charset=UTF-8";var r=await fetch(url,{method:sendMethod,headers:hs,body:body,cache:"no-store"}),d={};try{d=await r.json()}catch(e){}if(r.status===401&&path!=="/api/login"){safeDel();$("login").classList.add("show");throw Error("unauthorized")}if(!r.ok)throw Error(d.error||("通信エラー ("+r.status+")"));return d}
function toast(m){var t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(window.tt);window.tt=setTimeout(function(){t.classList.remove("show")},1700)}function days(x){if(!x)return null;var a=new Date(x+"T00:00:00"),b=new Date();b.setHours(0,0,0,0);return Math.round((a-b)/86400000)}function ex(x){var n=days(x);if(n===null)return["期限未設定",""];if(n<0)return["期限切れ "+Math.abs(n)+"日","expired"];if(n===0)return["今日まで","today"];if(n<=3)return["あと"+n+"日","soon"];return[x.replace(/-/g,"/"),""]}function fmt(v){var n=Number(v);return Number.isInteger(n)?String(n):String(n).replace(/0+$/,"").replace(/[.]$/,"")}
function render(){var a=st.items.slice(),q=st.q.trim().toLowerCase();if(st.s!=="すべて")a=a.filter(function(x){return x.storage===st.s});if(q)a=a.filter(function(x){return (x.name+" "+(x.memo||"")+" "+x.category).toLowerCase().indexOf(q)>=0});a.sort(function(x,y){if(st.sort==="name")return x.name.localeCompare(y.name,"ja");if(st.sort==="updated")return new Date(y.updated_at)-new Date(x.updated_at);return new Date(x.expiry_date||"2999-12-31")-new Date(y.expiry_date||"2999-12-31")});$("count").textContent=a.length+"件";$("all").textContent=st.items.length;$("soon").textContent=st.items.filter(function(x){var d=days(x.expiry_date);return d!==null&&d>=0&&d<=3}).length;$("expired").textContent=st.items.filter(function(x){var d=days(x.expiry_date);return d!==null&&d<0}).length;if(!a.length){$("list").innerHTML='<div class="empty"><div style="font-size:42px">🧺</div><b>食材はありません</b><span>「食材を追加」から登録できます。</span></div>';return}$("list").innerHTML=a.map(function(x){var e=ex(x.expiry_date);return '<article class="item" data-id="'+x.id+'"><div class="top"><div class="emo">'+(em[x.category]||"📦")+'</div><div class="main"><div class="row"><div class="name">'+esc(x.name)+'</div><span class="tag">'+esc(x.storage)+'</span></div>'+(x.memo?'<div class="memo">'+esc(x.memo)+'</div>':"")+'<div class="expiry '+e[1]+'">'+esc(e[0])+'</div></div></div><div class="actions"><div class="qty"><button data-a="minus">−</button><div class="qtxt">'+fmt(x.quantity)+" "+esc(x.unit)+'</div><button data-a="plus">＋</button></div><div class="ab"><button class="small" data-a="edit">編集</button><button class="small done" data-a="done">使い切り</button></div></div></article>'}).join("")}
async function load(){try{var d=await api("/api/items");st.items=d.items||[];$("sync").textContent="同期済み "+new Date().toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"});render()}catch(e){if(e.message!=="unauthorized")toast(e.message)}}function open(x){$("id").value=x?x.id:"";$("title").textContent=x?"食材を編集":"食材を追加";$("name").value=x?x.name:"";$("storage").value=x?x.storage:"冷蔵";$("category").value=x?x.category:"その他";$("expiry").value=x&&x.expiry_date?x.expiry_date:"";$("quantity").value=x?x.quantity:1;$("unit").value=x?x.unit:"個";$("memo").value=x?x.memo||"":"";$("del").style.display=x?"block":"none";$("overlay").classList.add("show")}function close(){$("overlay").classList.remove("show")}
async function remove(id){try{await api("/api/items/"+id,{method:"DELETE"});st.items=st.items.filter(function(x){return x.id!==id});render();close();toast("削除しました")}catch(e){toast(e.message)}}async function adjust(id,n){var x=st.items.find(function(v){return v.id===id});if(!x)return;var q=Math.max(0,Number(x.quantity)+n);try{await api("/api/items/"+id,{method:"PATCH",body:JSON.stringify({quantity:q})});x.quantity=q;render()}catch(e){toast(e.message)}}
async function doLogin(){var c=$("pass").value.trim(),b=$("loginbtn");$("err").textContent="";if(c.length!==6){$("err").textContent="6桁で入力してください";return}b.disabled=true;b.textContent="確認中…";try{var d=await api("/api/login",{method:"POST",body:JSON.stringify(c)});safeSet(d.token);$("login").classList.remove("show");$("pass").value="";await load()}catch(e){$("err").textContent=e&&e.message==="暗証番号が違います"?"暗証番号が違います":"接続できません。もう一度お試しください"}finally{b.disabled=false;b.textContent="開く"}}$("loginForm").onsubmit=function(e){e.preventDefault();doLogin()};$("logout").onclick=async function(){if(confirm("この端末の認証を解除しますか？")){try{await api("/api/logout",{method:"POST"})}catch(e){}safeDel();$("login").classList.add("show")}};$("refresh").onclick=load;$("add").onclick=function(){open(null)};$("close").onclick=close;$("overlay").onclick=function(e){if(e.target===$("overlay"))close()};
$("form").onsubmit=async function(e){e.preventDefault();var id=$("id").value,o={name:$("name").value.trim(),storage:$("storage").value,category:$("category").value,expiry_date:$("expiry").value||null,quantity:Number($("quantity").value||0),unit:$("unit").value,memo:$("memo").value.trim()};try{if(id)await api("/api/items/"+id,{method:"PATCH",body:JSON.stringify(o)});else await api("/api/items",{method:"POST",body:JSON.stringify(o)});close();await load();toast(id?"更新しました":"追加しました")}catch(e){toast(e.message)}};$("del").onclick=function(){var id=$("id").value;if(id&&confirm("この食材を削除しますか？"))remove(id)};$("search").oninput=function(){st.q=this.value;render()};$("sort").onchange=function(){st.sort=this.value;render()};$("tabs").onclick=function(e){var b=e.target.closest(".tab");if(!b)return;st.s=b.dataset.s;document.querySelectorAll(".tab").forEach(function(x){x.classList.toggle("on",x===b)});render()};$("list").onclick=function(e){var b=e.target.closest("button[data-a]");if(!b)return;var id=b.closest(".item").dataset.id,a=b.dataset.a;if(a==="plus")adjust(id,1);if(a==="minus")adjust(id,-1);if(a==="edit")open(st.items.find(function(x){return x.id===id}));if(a==="done"&&confirm("使い切ったものとして削除しますか？"))remove(id)};(async function(){try{await api("/api/session");$("login").classList.remove("show");await load()}catch(e){$("login").classList.add("show")}})()})();
</script><!-- fridge-github-pages-v1 --></body></html>
