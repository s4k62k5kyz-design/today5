<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ミニレター宛名プリンター</title>
<style>
:root{--pw:277mm;--ph:201mm;--rx:42mm;--ry:40mm;--sx:10mm;--sy:148mm}
*{box-sizing:border-box}html,body{margin:0;background:#f4f6f8;color:#17202a;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif}body{min-height:100vh}button,input,select,textarea{font:inherit}.app{max-width:1200px;margin:auto;padding:18px}.hero{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:14px}h1{font-size:clamp(21px,3vw,30px);margin:0 0 5px}.sub{color:#5d6874;font-size:13px}.badge{background:#fff1cc;border:1px solid #f1cf70;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:700;color:#725200;white-space:nowrap}.notice{background:#fff8e6;border:1px solid #ead39a;border-radius:13px;padding:12px 14px;font-size:13px;line-height:1.6;margin-bottom:14px}.grid{display:grid;grid-template-columns:390px minmax(0,1fr);gap:16px}.panel{background:#fff;border:1px solid #e2e6ea;border-radius:16px;box-shadow:0 6px 22px rgba(0,0,0,.05);overflow:hidden}.panel h2{font-size:15px;margin:0;padding:13px 15px;border-bottom:1px solid #eef0f2;background:#fafbfc}.section{padding:13px 15px;border-bottom:1px solid #eef0f2}.row,.pos{display:grid;grid-template-columns:1fr 1fr;gap:9px}label{display:block;font-size:12px;color:#57616b;margin:0 0 5px;font-weight:650}input,textarea,select{width:100%;border:1px solid #d8dde2;border-radius:9px;padding:9px 10px;background:#fff;outline:none}textarea{min-height:58px;resize:vertical}.switch{display:flex;align-items:center;gap:8px;font-size:13px}.switch input{width:auto}.mini{font-size:11px;color:#6c7680;line-height:1.5;margin-top:6px}.btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}button{border:0;border-radius:10px;padding:10px 12px;font-weight:750;cursor:pointer}.primary{background:#1f6fae;color:white}.secondary,.mode{background:#edf2f6;color:#27323c}.mode.active{background:#243442;color:#fff}.preview{padding:14px}.toolbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;margin-bottom:10px}.toolbar>div{display:flex;gap:8px;flex-wrap:wrap}.viewport{overflow:auto;background:#dfe4e8;border-radius:12px;padding:18px;min-height:520px;display:flex;justify-content:center}.scale{transform-origin:top left}#paper{position:relative;width:var(--pw);height:var(--ph);background:#fff;box-shadow:0 3px 18px rgba(0,0,0,.18);overflow:hidden;flex:none}.work{position:absolute;inset:0}.hidden{display:none!important}.fold{position:absolute;top:18mm;height:165mm;border-left:1px dashed #9fb6c9;pointer-events:none}.f1{left:92mm}.f2{left:184mm}.frontHint{position:absolute;left:0;top:18mm;width:92mm;height:165mm;border:1px dashed rgba(80,130,170,.45);background:rgba(108,166,211,.03)}.frontHint:after{content:"表面・宛名面";position:absolute;left:3mm;bottom:2mm;color:#7790a4;font-size:3mm}.stamp{position:absolute;left:8mm;top:26mm;width:18mm;height:22mm;border:1px dashed #9db2c1;color:#8da1af;font-size:3mm;display:flex;align-items:center;justify-content:center}.zipHint{position:absolute;left:43mm;top:28mm;width:42mm;height:8mm;border:1px dashed #c9a2a2;color:#aa8585;font-size:3mm;display:flex;align-items:center;justify-content:center}.back:before{content:"裏面イメージ";position:absolute;left:6mm;top:6mm;color:#8092a1;font-size:4mm}.senderHint{position:absolute;left:6mm;top:138mm;width:80mm;height:36mm;border:1px dashed rgba(80,130,170,.45);background:rgba(108,166,211,.03)}.senderHint:after{content:"裏面 左下の差出人欄";position:absolute;left:3mm;bottom:2mm;color:#7790a4;font-size:3mm}.recipient,.sender{position:absolute;left:0;top:0;cursor:move;user-select:none;outline:1px dashed rgba(49,106,152,.35);outline-offset:2mm}.recipient{transform:translate(var(--rx),var(--ry));width:44mm;height:108mm}.sender{transform:translate(var(--sx),var(--sy));width:78mm;height:32mm;font-size:3.2mm;line-height:1.42;white-space:pre-wrap}.rzip{position:absolute;left:0;top:0;font-size:4.1mm;letter-spacing:.75mm}.vertical .raddr{position:absolute;right:2mm;top:12mm;height:90mm;max-width:19mm;writing-mode:vertical-rl;font-size:4.2mm;line-height:1.45;white-space:pre-wrap}.vertical .rname{position:absolute;left:4mm;top:24mm;height:80mm;writing-mode:vertical-rl;font-size:7mm;white-space:nowrap;font-weight:650}.horizontal .raddr{position:absolute;left:0;top:13mm;width:44mm;font-size:3.7mm;line-height:1.45;white-space:pre-wrap}.horizontal .rname{position:absolute;left:0;top:43mm;width:44mm;font-size:6mm;font-weight:650;white-space:pre-wrap}.sender .szip{font-size:3mm;letter-spacing:.35mm;margin-bottom:1mm}.sender .sname{font-size:3.5mm;font-weight:650;margin-top:1mm}.a4{width:297mm!important;height:210mm!important}.a4 .frame{position:absolute;left:10mm;top:4.5mm;width:277mm;height:201mm;border:1px solid #111}.a4 .work{left:10mm;top:4.5mm;width:277mm;height:201mm;inset:auto}.status{font-size:12px;color:#337047;min-height:18px;margin-top:8px}
@media(max-width:980px){.grid{grid-template-columns:1fr}.btns{grid-template-columns:1fr}.hero{display:block}.badge{display:inline-block;margin-top:8px}}
@media print{html,body{background:#fff!important;margin:0!important}.app>*:not(.grid),.controls,.toolbar{display:none!important}.grid{display:block!important}.preview{padding:0!important;border:0!important;box-shadow:none!important}.viewport{padding:0!important;background:white!important;overflow:visible!important;min-height:0!important}.scale{transform:none!important}#paper{box-shadow:none!important;margin:0!important}.recipient,.sender{outline:none!important}#paper:not(.test) .fold,#paper:not(.test) .frontHint,#paper:not(.test) .stamp,#paper:not(.test) .zipHint,#paper:not(.test) .back:before,#paper:not(.test) .senderHint{display:none!important}#paper:not(.test).a4 .frame{display:none!important}}
</style>
<style id="pageStyle">@page{size:277mm 201mm;margin:0}</style>
</head>
<body>
<div class="app">
<div class="hero"><div><h1>ミニレター宛名プリンター</h1><div class="sub">表面の宛名／裏面左下の差出人欄を位置調整して印刷</div></div><div class="badge">EW-M754T向け試作</div></div>
<div class="notice"><b>注意：</b>直接印刷はメーカー保証された方法ではありません。最初はA4テストで位置を確認し、直接印刷する場合は未折り状態・1枚ずつで試してください。</div>
<div class="grid">
<div class="panel controls">
<h2>宛先（表面）</h2><div class="section">
<label>郵便番号</label><input id="rzipIn" placeholder="1234567" maxlength="8">
<label style="margin-top:9px">住所</label><textarea id="raddrIn" placeholder="東京都〇〇区…"></textarea>
<div class="row" style="margin-top:9px"><div><label>宛名</label><input id="rnameIn" placeholder="山田 太郎"></div><div><label>敬称</label><select id="honor"><option>様</option><option>御中</option><option>先生</option><option value="">なし</option></select></div></div>
<div class="row" style="margin-top:9px"><div><label>表記</label><select id="orientation"><option value="vertical">縦書き</option><option value="horizontal">横書き</option></select></div><div><label>宛名サイズ(mm)</label><input id="nameSize" type="number" value="7" min="4" max="12" step=".5"></div></div>
</div>
<h2>差出人（裏面左下）</h2><div class="section">
<label class="switch"><input id="senderOn" type="checkbox"> 差出人も印刷する</label>
<div id="senderFields" class="hidden" style="margin-top:9px"><input id="szipIn" placeholder="〒123-4567"><textarea id="saddrIn" placeholder="住所" style="margin-top:7px"></textarea><input id="snameIn" placeholder="氏名" style="margin-top:7px"></div>
</div>
<h2>位置調整</h2><div class="section">
<div class="mini">プレビュー上の文字をドラッグしても移動できます。</div>
<div class="pos" style="margin-top:9px"><div><label>宛名 X</label><input id="rx" type="number" step=".5" value="42"></div><div><label>宛名 Y</label><input id="ry" type="number" step=".5" value="40"></div></div>
<div class="pos" style="margin-top:9px"><div><label>差出人 X</label><input id="sx" type="number" step=".5" value="10"></div><div><label>差出人 Y</label><input id="sy" type="number" step=".5" value="148"></div></div>
<div class="pos" style="margin-top:9px"><div><label>用紙幅</label><input id="pw" type="number" step=".5" value="277"></div><div><label>用紙高さ</label><input id="ph" type="number" step=".5" value="201"></div></div>
<div class="row" style="margin-top:10px"><button class="secondary" id="reset">初期化</button><button class="secondary" id="save">設定保存</button></div><div id="status" class="status"></div>
</div>
<h2>印刷</h2><div class="section"><div class="btns"><button class="primary" id="testBtn">① A4テスト</button><button class="primary" id="frontBtn">② 表面印刷</button><button class="primary" id="backBtn">③ 裏面印刷</button></div><div class="mini">印刷画面では倍率100%／実際のサイズを選んでください。</div></div>
</div>
<div class="panel preview">
<div class="toolbar"><div><button class="mode active" id="frontView">表面プレビュー</button><button class="mode" id="backView">裏面プレビュー</button></div><div><button class="mode active" id="guideOn">ガイドあり</button><button class="mode" id="guideOff">印刷イメージ</button></div></div>
<div class="viewport" id="viewport"><div class="scale" id="scale"><div id="paper"><div class="frame hidden"></div><div class="work" id="work">
<div id="frontLayer"><div class="fold f1"></div><div class="fold f2"></div><div class="frontHint"></div><div class="stamp">料額<br>印面</div><div class="zipHint">郵便番号枠</div><div id="recipient" class="recipient vertical"><div id="rzipOut" class="rzip"></div><div id="raddrOut" class="raddr"></div><div id="rnameOut" class="rname"></div></div></div>
<div id="backLayer" class="back hidden"><div class="senderHint"></div><div id="sender" class="sender hidden"><div id="szipOut" class="szip"></div><div id="saddrOut"></div><div id="snameOut" class="sname"></div></div></div>
</div></div></div></div>
</div>
</div>
</div>
<script>
(function(){
var $=function(id){return document.getElementById(id)},root=document.documentElement.style,paper=$("paper"),work=$("work"),recipient=$("recipient"),sender=$("sender"),pageStyle=$("pageStyle"),side="front",guides=true;
var ids=["rzipIn","raddrIn","rnameIn","honor","orientation","nameSize","senderOn","szipIn","saddrIn","snameIn","rx","ry","sx","sy","pw","ph"];
function zip(v){var d=(v||"").replace(/\D/g,"").slice(0,7);return d.length>3?d.slice(0,3)+"-"+d.slice(3):d}
function fit(){requestAnimationFrame(function(){var vp=$("viewport"),sw=paper.offsetWidth,sh=paper.offsetHeight,s=Math.min(1,(vp.clientWidth-40)/sw,(window.innerHeight*.66)/sh);$("scale").style.transform="scale("+s+")";$("scale").style.width=sw*s+"px";$("scale").style.height=sh*s+"px"})}
function update(){
$("rzipOut").textContent=zip($("rzipIn").value);$("raddrOut").textContent=$("raddrIn").value;var n=$("rnameIn").value.trim(),h=$("honor").value;$("rnameOut").textContent=n+(n&&h?"　"+h:h);
recipient.classList.toggle("vertical",$("orientation").value==="vertical");recipient.classList.toggle("horizontal",$("orientation").value==="horizontal");$("rnameOut").style.fontSize=$("nameSize").value+"mm";
$("senderFields").classList.toggle("hidden",!$("senderOn").checked);sender.classList.toggle("hidden",!$("senderOn").checked||side!=="back");$("szipOut").textContent=$("szipIn").value;$("saddrOut").textContent=$("saddrIn").value;$("snameOut").textContent=$("snameIn").value;
root.setProperty("--rx",+$("rx").value+"mm");root.setProperty("--ry",+$("ry").value+"mm");root.setProperty("--sx",+$("sx").value+"mm");root.setProperty("--sy",+$("sy").value+"mm");if(!paper.classList.contains("a4")){root.setProperty("--pw",+$("pw").value+"mm");root.setProperty("--ph",+$("ph").value+"mm")}fit()}
ids.forEach(function(id){$(id).addEventListener($(id).type==="checkbox"?"change":"input",update)});$("honor").onchange=update;$("orientation").onchange=update;window.onresize=fit;
function setSide(s){side=s;$("frontLayer").classList.toggle("hidden",s!=="front");$("backLayer").classList.toggle("hidden",s!=="back");$("frontView").classList.toggle("active",s==="front");$("backView").classList.toggle("active",s==="back");update()}
$("frontView").onclick=function(){setSide("front")};$("backView").onclick=function(){setSide("back")};
$("guideOn").onclick=function(){guides=true;$("guideOn").classList.add("active");$("guideOff").classList.remove("active");paper.classList.add("test")};$("guideOff").onclick=function(){guides=false;$("guideOff").classList.add("active");$("guideOn").classList.remove("active");paper.classList.remove("test")};
function drag(el,xid,yid){var st=null;el.onpointerdown=function(e){st={x:e.clientX,y:e.clientY,ox:+$(xid).value,oy:+$(yid).value};el.setPointerCapture(e.pointerId)};el.onpointermove=function(e){if(!st)return;var r=paper.getBoundingClientRect(),ppm=(r.width/paper.offsetWidth)*(96/25.4);$(xid).value=(st.ox+(e.clientX-st.x)/ppm).toFixed(1);$(yid).value=(st.oy+(e.clientY-st.y)/ppm).toFixed(1);update()};el.onpointerup=function(){st=null}}
drag(recipient,"rx","ry");drag(sender,"sx","sy");
function direct(s){setSide(s);paper.classList.remove("a4","test");$("paper").querySelector(".frame").classList.add("hidden");work.style.cssText="position:absolute;inset:0";root.setProperty("--pw",+$("pw").value+"mm");root.setProperty("--ph",+$("ph").value+"mm");pageStyle.textContent="@page{size:"+$("pw").value+"mm "+$("ph").value+"mm;margin:0}";setTimeout(function(){window.print()},120)}
function test(){paper.classList.add("a4","test");$("paper").querySelector(".frame").classList.remove("hidden");root.setProperty("--pw","297mm");root.setProperty("--ph","210mm");work.style.cssText="position:absolute;left:10mm;top:4.5mm;width:"+$("pw").value+"mm;height:"+$("ph").value+"mm";pageStyle.textContent="@page{size:A4 landscape;margin:0}";fit();setTimeout(function(){window.print()},120)}
$("testBtn").onclick=test;$("frontBtn").onclick=function(){direct("front")};$("backBtn").onclick=function(){direct("back")};
$("reset").onclick=function(){$("rx").value=42;$("ry").value=40;$("sx").value=10;$("sy").value=148;update()};
$("save").onclick=function(){var o={};ids.forEach(function(id){o[id]=$(id).type==="checkbox"?$(id).checked:$(id).value});o.side=side;localStorage.setItem("miniLetterPrinter",JSON.stringify(o));$("status").textContent="保存しました";setTimeout(function(){$("status").textContent=""},2000)};
try{var o=JSON.parse(localStorage.getItem("miniLetterPrinter")||"null");if(o){ids.forEach(function(id){if(o[id]!==undefined){if($(id).type==="checkbox")$(id).checked=!!o[id];else $(id).value=o[id]}});if(o.side==="back")side="back"}}catch(e){}
setSide(side);paper.classList.add("test");update();fit();
})();
</script>
</body></html>
